#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "conduit"
name = "Conduit"
description.en = "Self-hosted CRM with pipelines, projects, Gantt charts and an integrated inbox"

version = "1.0.0~ynh1"

maintainers = ["chriswilson2020"]

[upstream]
license = "AGPL-3.0-or-later"
code = "https://github.com/chriswilson2020/conduit_ynh"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
ldap = "not_relevant"
sso = true
disk = "2G"
ram.build = "50M"
# 400M for the Node API as before, plus 700M for renders. A render is a separate
# Python process, not memory the API already had, and what bounds its cost is the
# input cap rather than the timeout.
#
# RE-MEASURED, AND THE FIRST FIGURE WAS 2.1x TOO LOW. It said 157MB at
# documents-render.ts's 128KB cap, from a friendly document. Driven through the
# shipped renderPdf on the Debian 12 target, with the child's peak RSS sampled from
# /proc, the same cap costs 238MB for a quote-shaped table and 332MB for a table of
# minimal rows -- the ROW COUNT drives the cost more than the byte count does, and a
# template is user-editable, so 332MB is the honest worst case. (The same 128KB of
# prose is 84MB.)
#
# TWO is the concurrency limit documents-render.ts enforces, and this number is only
# true if it does: 400 + 2 x 332 = 1,064M. It was three against the old figure, which
# would now be 1,396M -- a third of a 3819MB machine that has NO SWAP, where
# overshooting is an OOM kill rather than a slowdown. Advisory either way -- YunoHost
# sets no cgroup from it and does not evaluate it at install -- so the real protection
# is the input cap plus that limit, and this is the honest declaration of what the two
# of them add up to. A test asserts the arithmetic against this literal.
ram.runtime = "1100M"

[install]

    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/conduit"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

[resources]

    [resources.sources.main]
    url = "https://github.com/chriswilson2020/conduit_ynh/releases/download/v1.0.0/conduit-1.0.0.tar.gz"
    sha256 = "0302d6907541b67e6708cbcc508e15278cdd59610f4e141172cc81aae2c183fc"
    autoupdate.strategy = "latest_github_release"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.data_dir]

    [resources.ports]

    [resources.permissions]
    main.url = "/"
    main.auth_header = true

    # weasyprint renders quote PDFs (packages/api/src/services/documents-render.ts).
    #
    # python3-munkres is here for its side effect on the dependency solver, and it is
    # not a typo. weasyprint depends on python3-fonttools, whose dependency is the
    # alternative "python3-scipy | python3-munkres". apt takes the first alternative
    # unless a later one is already coming, and python3-scipy drags in python3-pythran,
    # which hard-depends on g++ and libboost-dev: measured on the Debian 12 target,
    # `apt-get install weasyprint` alone is 69 packages, 80MB of downloads and 508MB
    # installed, versus 39 packages, 18MB and 89MB when munkres is named alongside it.
    # Neither package is ever imported by anything WeasyPrint does here; this only
    # decides which of them satisfies the alternative.
    #
    # No font package is listed because one is already guaranteed: weasyprint pulls in
    # fontconfig, and fontconfig-config depends on "fonts-dejavu-core | ..." -- so a
    # host that has WeasyPrint has at least DejaVu for sans-serif to resolve to.
    [resources.apt]
    packages = "postgresql, python3-munkres, weasyprint"

    [resources.database]
    type = "postgresql"

    [resources.nodejs]
    version = "24"
