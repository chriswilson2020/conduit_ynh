#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "conduit"
name = "Conduit"
description.en = "Self-hosted CRM with pipelines, projects, Gantt charts and an integrated inbox"

version = "1.0.1~ynh1"

maintainers = ["chriswilson2020"]

[upstream]
license = "AGPL-3.0-or-later"
code = "https://github.com/chriswilson2020/conduit_ynh"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
ldap = "not_relevant"
sso = true
disk = "2G"
ram.build = "50M"
# 400M for the Node API, plus RENDER_MAX_CONCURRENCY renders at the limit each render
# is now HELD TO BY THE KERNEL: 400 + 2 x 512 = 1,424M.
#
# THIS NUMBER IS ENFORCED FOR THE FIRST TIME. Every previous version of it was an
# estimate of what a render would use, and three review rounds in a row found a
# document that beat the estimate -- a mime type respelt, a JPEG2000 that decodes to
# 36 megapixels from 334 bytes, a GIF whose logical screen lies about its size, a
# single space inside a base64 payload. Each was charged nothing by the accounting and
# rendered at 534MB to 703MB against a declaration of 1,150M. The render child now
# sets RLIMIT_DATA on itself before it imports anything, so a document that wants more
# dies with a clean error instead of a number in this file being wrong.
#
# MEASURED, on this Debian 12 target, through the shipped renderPdf with /proc sampled
# every 25ms: the worst legitimate document -- a full markup budget of minimal table
# rows with a 16-megapixel logo beside it -- is 340MB resident and 335MB of data, and
# renders. The two bombs above are refused at 80MB and 189MB. 512M is 1.53x the worst
# legitimate figure, which is margin for CI's WeasyPrint 61.1 against this server's
# 57.2 rather than slack.
#
# RLIMIT_DATA bounds brk and anonymous mappings, which is where a decoded raster
# lives; file-backed pages (shared libraries and fonts) sit outside it and measured
# under 20MB resident, shared between the children. So this declaration is an upper
# bound rather than an average, and documents-render.test.ts asserts the arithmetic
# against this literal.
ram.runtime = "1424M"

[install]

    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/conduit"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

[resources]

    [resources.sources.main]
    url = "https://github.com/chriswilson2020/conduit_ynh/releases/download/v1.0.0/conduit-1.0.0.tar.gz"
    sha256 = "0302d6907541b67e6708cbcc508e15278cdd59610f4e141172cc81aae2c183fc"
    autoupdate.strategy = "latest_github_release"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.data_dir]

    [resources.ports]

    [resources.permissions]
    main.url = "/"
    main.auth_header = true

    # weasyprint renders quote PDFs (packages/api/src/services/documents-render.ts).
    #
    # python3-munkres is here for its side effect on the dependency solver, and it is
    # not a typo. weasyprint depends on python3-fonttools, whose dependency is the
    # alternative "python3-scipy | python3-munkres". apt takes the first alternative
    # unless a later one is already coming, and python3-scipy drags in python3-pythran,
    # which hard-depends on g++ and libboost-dev: measured on the Debian 12 target,
    # `apt-get install weasyprint` alone is 69 packages, 80MB of downloads and 508MB
    # installed, versus 39 packages, 18MB and 89MB when munkres is named alongside it.
    # Neither package is ever imported by anything WeasyPrint does here; this only
    # decides which of them satisfies the alternative.
    #
    # No font package is listed because one is already guaranteed: weasyprint pulls in
    # fontconfig, and fontconfig-config depends on "fonts-dejavu-core | ..." -- so a
    # host that has WeasyPrint has at least DejaVu for sans-serif to resolve to.
    [resources.apt]
    packages = "postgresql, python3-munkres, weasyprint"

    [resources.database]
    type = "postgresql"

    [resources.nodejs]
    version = "24"
