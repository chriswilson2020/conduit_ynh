#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "conduit"
name = "Conduit"
description.en = "Self-hosted CRM with pipelines, projects, Gantt charts and an integrated inbox"

version = "1.0.1~ynh1"

maintainers = ["chriswilson2020"]

[upstream]
license = "AGPL-3.0-or-later"
code = "https://github.com/chriswilson2020/conduit_ynh"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
ldap = "not_relevant"
sso = true
disk = "2G"
ram.build = "50M"
# 400M for the Node API as before, plus 750M for renders. A render is a separate
# Python process, not memory the API already had, and what bounds its cost is the
# input caps rather than the timeout.
#
# RE-MEASURED FOR v1.0.1, THE SAME WAY AND ON THE SAME MACHINE: driven through the
# shipped renderPdf on the Debian 12 target, with the child's peak RSS sampled from
# /proc every 50ms. Two figures this comment carried have moved, and neither moved
# because anything was edited to taste -- the dense-row worst case at the old 128KB
# cap measures 345MB rather than the 332MB recorded, and 128KB of prose measures
# 71MB rather than 84MB.
#
# WHAT THIS RELEASE CHANGED IS THE SHAPE OF THE WORST CASE, NOT JUST ITS SIZE. The
# markup cap is 87,357 bytes now (250MB of minimal table rows, measured), and a
# `data:` image gets a separate 409,623-byte allowance that cannot contain a table
# row. The worst document that can now be built is a full markup budget of rows with
# a logo at the pixel bound beside it: 353MB, measured. The logo's file size is not
# what decides that -- 12,227 bytes of PNG can be 100 megapixels and 535MB, which is
# why there is a 16,000,000-pixel cap and why it is enforced at the renderer.
#
# TWO is the concurrency limit documents-render.ts enforces, and this number is only
# true if it does: 400 + 2 x 353 = 1,106M. It was 1100M against v1.0.0's worst case,
# which the same method now puts at 345MB (400 + 2 x 345 = 1,090M, still true). Three
# renders would be 1,459M -- a third of a 3819MB machine that has NO SWAP, where
# overshooting is an OOM kill rather than a slowdown. Advisory either way -- YunoHost
# sets no cgroup from it and does not evaluate it at install -- so the real protection
# is the input caps plus that limit, and this is the honest declaration of what they
# add up to. A test asserts the arithmetic against this literal.
ram.runtime = "1150M"

[install]

    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/conduit"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

[resources]

    [resources.sources.main]
    url = "https://github.com/chriswilson2020/conduit_ynh/releases/download/v1.0.0/conduit-1.0.0.tar.gz"
    sha256 = "0302d6907541b67e6708cbcc508e15278cdd59610f4e141172cc81aae2c183fc"
    autoupdate.strategy = "latest_github_release"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.data_dir]

    [resources.ports]

    [resources.permissions]
    main.url = "/"
    main.auth_header = true

    # weasyprint renders quote PDFs (packages/api/src/services/documents-render.ts).
    #
    # python3-munkres is here for its side effect on the dependency solver, and it is
    # not a typo. weasyprint depends on python3-fonttools, whose dependency is the
    # alternative "python3-scipy | python3-munkres". apt takes the first alternative
    # unless a later one is already coming, and python3-scipy drags in python3-pythran,
    # which hard-depends on g++ and libboost-dev: measured on the Debian 12 target,
    # `apt-get install weasyprint` alone is 69 packages, 80MB of downloads and 508MB
    # installed, versus 39 packages, 18MB and 89MB when munkres is named alongside it.
    # Neither package is ever imported by anything WeasyPrint does here; this only
    # decides which of them satisfies the alternative.
    #
    # No font package is listed because one is already guaranteed: weasyprint pulls in
    # fontconfig, and fontconfig-config depends on "fonts-dejavu-core | ..." -- so a
    # host that has WeasyPrint has at least DejaVu for sans-serif to resolve to.
    [resources.apt]
    packages = "postgresql, python3-munkres, weasyprint"

    [resources.database]
    type = "postgresql"

    [resources.nodejs]
    version = "24"
