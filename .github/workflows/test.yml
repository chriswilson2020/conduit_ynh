name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit
          POSTGRES_DB: conduit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # The SMTP half of the mail integration suite. Mailpit fits here where
      # Dovecot does not (see the "Start Dovecot" step): `sans:` makes it
      # generate its own self-signed certificate at boot, so it needs no file
      # from a workspace that does not exist yet when service containers start.
      mailpit:
        image: axllent/mailpit:v1.30.7
        ports:
          - 1025:1025
          - 8025:8025
        env:
          MP_SMTP_TLS_CERT: sans:localhost,127.0.0.1
          MP_SMTP_TLS_KEY: sans:localhost,127.0.0.1
          # Mailpit only advertises AUTH LOGIN/PLAIN on an encrypted
          # connection, so accepting any credentials still requires the
          # STARTTLS upgrade the adapter demands before it sends them.
          MP_SMTP_AUTH_ACCEPT_ANY: "true"

    env:
      # A full TCP connection string. postgres.js (packages/api/src/db/client.ts)
      # takes the host, port, user, password and database from this URL and only
      # falls back to PGHOST/PGPORT/etc when the URL leaves them unset -- so this is
      # honoured as-is and the PGHOST=/run/postgresql fallback that global-setup.ts
      # sets for the dev server's socket connection never comes into play here.
      TEST_DATABASE_URL: postgres://conduit:conduit@localhost:5432/conduit_test

      # The mail integration suite's gate and its targets
      # (packages/api/src/test/mail-integration.test.ts). Without MAIL_IT the
      # whole file skips, which is how it stays a no-op on a developer machine.
      MAIL_IT: "1"
      MAIL_IT_IMAP_HOST: 127.0.0.1
      MAIL_IT_IMAP_PORT: "993"
      MAIL_IT_IMAP_STARTTLS_PORT: "1144"
      MAIL_IT_IMAP_NO_TLS_PORT: "1143"
      MAIL_IT_SMTP_HOST: 127.0.0.1
      MAIL_IT_SMTP_PORT: "1025"
      MAIL_IT_MAILPIT_URL: http://127.0.0.1:8025
      MAIL_IT_USERNAME: conduit@test.local
      MAIL_IT_PASSWORD: testpass
      # CI ONLY. Both mail servers here serve self-signed certificates, and
      # the suite proves in both directions that this flag is what decides
      # whether that is accepted. config.ts fails safe: only the exact string
      # "0" turns verification off.
      MAIL_TLS_REJECT_UNAUTHORIZED: "0"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      # Before `npm ci`, so the containers boot while dependencies install.
      # Dovecot cannot be a service container: it needs config files, and
      # service containers are created before the workspace is checked out.
      - name: Start Dovecot
        run: .github/scripts/start-dovecot.sh
      # The gate on packages/api/src/services/documents-render.test.ts: without the
      # binary its render half skips, so this step is what makes CI the place the
      # PDF path is actually proved. The package list matches manifest.toml's
      # resources.apt (minus postgresql, which is a service container here) so CI
      # exercises the same dependency resolution the server will -- see that file
      # for why python3-munkres is named. DEBIAN_FRONTEND because an apt-get that
      # tries to prompt on a runner hangs until the job's timeout rather than
      # failing (the e2e job's Playwright step carries the scar).
      - name: Install WeasyPrint
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3-munkres weasyprint
          weasyprint --version
      - name: Install dependencies
        run: npm ci
      # Protocol-level, not TCP-level: `docker run -p` publishes through a
      # proxy that accepts connections before Dovecot is listening behind it.
      - name: Wait for the mail servers
        run: node .github/scripts/wait-for-mail.mjs
      # Belt and braces over the `auto = create` mailboxes in the Dovecot
      # config: the suite has no create-mailbox call to fall back on, so the
      # folders have to exist before it runs. A no-op (and a non-zero exit)
      # when autocreation already did the job, hence the `|| true`.
      - name: Ensure the integration mailboxes exist
        run: >-
          docker exec conduit-dovecot doveadm mailbox create
          -u "$MAIL_IT_USERNAME" Sent Walk Drop Flags Dates Big Empty
          Trash Junk Archive Oubliette Move Moved MoveUid MoveBulk MoveBulkTarget || true
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npx vitest run
      - name: Mail server logs
        if: failure()
        run: |
          docker logs conduit-dovecot || true
          docker logs conduit-dovecot-nostarttls || true
          docker exec conduit-dovecot doveadm mailbox list -u "$MAIL_IT_USERNAME" || true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit
          POSTGRES_DB: conduit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Same pair as the unit job, here for e2e/mail.spec.ts (Phase 4 Task 11):
      # it seeds a thread over IMAP and reads the reply back out of Mailpit.
      mailpit:
        image: axllent/mailpit:v1.30.7
        ports:
          - 1025:1025
          - 8025:8025
        env:
          MP_SMTP_TLS_CERT: sans:localhost,127.0.0.1
          MP_SMTP_TLS_KEY: sans:localhost,127.0.0.1
          MP_SMTP_AUTH_ACCEPT_ANY: "true"

    env:
      # Same shape as the `test` job's TEST_DATABASE_URL above: a full TCP
      # connection string for the postgres service container. playwright.config.ts's
      # webServer passes this through to the server it boots as DATABASE_URL.
      TEST_DATABASE_URL: postgres://conduit:conduit@localhost:5432/conduit_test

      # Read by .github/scripts/start-dovecot.sh and wait-for-mail.mjs, which
      # are shared with the unit job.
      MAIL_IT_IMAP_HOST: 127.0.0.1
      MAIL_IT_IMAP_PORT: "993"
      MAIL_IT_IMAP_STARTTLS_PORT: "1144"
      MAIL_IT_IMAP_NO_TLS_PORT: "1143"
      MAIL_IT_SMTP_HOST: 127.0.0.1
      MAIL_IT_SMTP_PORT: "1025"
      MAIL_IT_MAILPIT_URL: http://127.0.0.1:8025
      MAIL_IT_USERNAME: conduit@test.local
      MAIL_IT_PASSWORD: testpass

      # What e2e/mail.spec.ts reads. Deliberately its own names rather than
      # the MAIL_IT_* set: the Playwright spec is a separate consumer of the
      # same containers, and naming them apart keeps a change to one suite's
      # fixture from silently retargeting the other's.
      E2E_MAIL_IMAP_HOST: 127.0.0.1
      E2E_MAIL_IMAP_PORT: "993"
      E2E_MAIL_SMTP_HOST: 127.0.0.1
      E2E_MAIL_SMTP_PORT: "1025"
      E2E_MAIL_USERNAME: conduit@test.local
      E2E_MAIL_PASSWORD: testpass
      E2E_MAILPIT_URL: http://127.0.0.1:8025

      # CI ONLY, and here it has to reach two processes: the Playwright
      # process itself, and the app that playwright.config.ts's webServer
      # boots (which passes this through explicitly -- its env block is a
      # whitelist, not an inheritance).
      MAIL_TLS_REJECT_UNAUTHORIZED: "0"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Start Dovecot
        run: .github/scripts/start-dovecot.sh
      # The SAME step the `test` job runs, and for a different reason: there the
      # binary un-skips the render suite, here it is what lets a quote be raised at
      # all. e2e/documents.spec.ts drives the real issuing transaction, which spawns
      # python3 with WeasyPrint's API -- on a runner without it every documents
      # journey fails on a 422 from a renderer that is not there. Task 1 flagged
      # this job as the gap and it stayed open until Task 6.
      #
      # python3-munkres is named for the reason manifest.toml names it: apt takes
      # the FIRST alternative of python3-fonttools' `python3-scipy | python3-munkres`
      # and drags a C++ toolchain in with it -- 69 packages and 508MB against 39 and
      # 89MB. DEBIAN_FRONTEND because an apt-get that tries to prompt on a runner
      # hangs until the job's timeout rather than failing (this job's Playwright step
      # carries that scar).
      - name: Install WeasyPrint
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3-munkres weasyprint
          weasyprint --version
      - name: Install dependencies
        run: npm ci
      # Browser binary only. NOT --with-deps: that shells out to apt-get, which
      # hung indefinitely here when a package tried to prompt. ubuntu-latest already
      # ships Chromium's shared libraries, so the download alone is enough. If a
      # future runner image drops them, add a separate step running
      # `sudo DEBIAN_FRONTEND=noninteractive npx playwright install-deps chromium`
      # rather than folding it back into this one, so an apt failure stays visible.
      - name: Install Playwright browser
        run: npx playwright install chromium
      # The AES-256-GCM key mail_accounts.credentials_ciphertext is sealed
      # with (mail-crypto.ts). config.ts defaults MAIL_KEY_PATH to
      # $DATA_DIR/mail.key and DATA_DIR to ./data, and nothing creates the file
      # -- scripts/install does that in a real deployment (Task 12). Reading it
      # is lazy, so this only matters once a spec adds a mail account.
      - name: Provision the mail credential key
        run: |
          mkdir -p data
          openssl rand -out data/mail.key 32
          chmod 600 data/mail.key
      - name: Wait for the mail servers
        run: node .github/scripts/wait-for-mail.mjs
      # Same reason as the unit job: e2e/mail.spec.ts (Task 11) seeds its
      # thread by APPENDing into folders it cannot create.
      - name: Ensure the integration mailboxes exist
        run: >-
          docker exec conduit-dovecot doveadm mailbox create
          -u "$MAIL_IT_USERNAME" Sent Walk Drop Flags Dates Big Empty
          Trash Junk Archive Oubliette Move Moved MoveUid MoveBulk MoveBulkTarget || true
      - name: Build workspaces
        run: npm run build
      - name: Run Playwright smoke tests
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      # Same dump the unit job takes, and for the same reason: when the
      # journey's sync finds nothing, "which folders exist, and did the
      # seeding APPEND land in one of them" is the first question, and the
      # containers are gone by the time anyone reads this.
      - name: Mail server logs
        if: failure()
        run: |
          docker logs conduit-dovecot || true
          docker logs conduit-dovecot-nostarttls || true
          docker exec conduit-dovecot doveadm mailbox list -u "$MAIL_IT_USERNAME" || true
