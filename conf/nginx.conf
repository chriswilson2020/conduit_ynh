#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;

# THE BACKUP ROUTE, AND THE ONLY THING THAT IS DIFFERENT ABOUT IT IS THE WAIT.
#
# 7.6's backup cannot stream. `7z` seeks to write its headers and with -mhe=on
# the header block is only final once the archive is, so the WHOLE archive is
# built before the first byte of the response exists (see
# packages/api/src/services/backup.ts). The gap between the request and the
# response is therefore the entire build, and proxy_read_timeout is exactly the
# directive that measures that gap.
#
# At the 300 seconds the block below carries, and the 24.4 MB/s Task 2's -mx=1
# measurement works out to on this hardware, an install of about 7.3GB would 504
# after five minutes with nothing to show for it -- and every check the service
# makes would have passed, because there was nothing wrong with it.
#
# ONE HOUR, which is about 88GB of headroom at that rate. Chris ruled on 31 Aug
# for BOTH halves rather than either: the raise buys the headroom, and
# GET /api/backup/preflight warns before a long one starts, so a wait that is
# still too long is a sentence rather than a surprise.
#
# SCOPED TO THIS ONE ROUTE, NOT RAISED GLOBALLY. Every other route in this app
# answers in milliseconds, and an hour applied to all of them would turn a
# wedged handler into an hour of held connection instead of a 504 somebody
# notices. YunoHost's own configuration draws the same line in the same file
# family: its admin API location carries proxy_read_timeout 3600s while its
# portal location carries 30s.
#
# `location =` IS AN EXACT MATCH, which is both the tightest possible scope and
# the highest-priority form nginx has -- so it wins over the app's `location
# __PATH__/` below without depending on which is written first, and it cannot
# widen to a sub-path nobody meant to include. `__PATH__/` is substituted to a
# single `/` at a root install (YunoHost's templating helper special-cases it),
# so this reads /api/backup there and /conduit/api/backup at a sub-path one.
#
# THE INCLUDE IS NOT DECORATION. proxy_set_header is not inherited into a
# location that is configured on its own, and proxy_params_with_auth is what
# carries the Ynh-User header SSOwat sets -- without it this route would see no
# identity at all and answer 401 to everybody. The SSOwat access phase itself is
# declared at the server level and so applies here without being repeated.
location = __PATH__/api/backup {

  proxy_pass http://127.0.0.1:__PORT__/api/backup;
  include proxy_params_with_auth;

  client_max_body_size 50M;
  proxy_read_timeout 3600;
  proxy_connect_timeout 30;

  proxy_buffering off;
  proxy_cache off;
}

location __PATH__/ {

  proxy_pass http://127.0.0.1:__PORT__/;
  include proxy_params_with_auth;

  client_max_body_size 50M;
  proxy_read_timeout 300;
  proxy_connect_timeout 30;

  # Server-sent events arrive in Phase 2 and need buffering off to stream.
  proxy_buffering off;
  proxy_cache off;
}
