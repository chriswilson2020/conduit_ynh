#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;

# THE BACKUP ROUTE, AND THE ONLY THING THAT IS DIFFERENT ABOUT IT IS THE WAIT.
#
# 7.6's backup cannot stream. `7z` seeks to write its headers and with -mhe=on
# the header block is only final once the archive is, so the WHOLE archive is
# built before the first byte of the response exists (see
# packages/api/src/services/backup.ts). The gap between the request and the
# response is therefore the entire build, and proxy_read_timeout is exactly the
# directive that measures that gap.
#
# At the 300 seconds the block below carries, and the 24.4 MB/s Task 2's -mx=1
# measurement works out to on this hardware, an install of about 7.3GB would 504
# after five minutes with nothing to show for it -- and every check the service
# makes would have passed, because there was nothing wrong with it.
#
# ONE HOUR, which is about 88GB of headroom at that rate. Chris ruled on 31 Aug
# for BOTH halves rather than either: the raise buys the headroom, and
# GET /api/backup/preflight warns before a long one starts, so a wait that is
# still too long is a sentence rather than a surprise.
#
# SCOPED TO THIS ONE ROUTE, NOT RAISED GLOBALLY. Every other route in this app
# answers in milliseconds, and an hour applied to all of them would turn a
# wedged handler into an hour of held connection instead of a 504 somebody
# notices. YunoHost's own configuration draws the same line in the same file
# family: its admin API location carries proxy_read_timeout 3600s while its
# portal location carries 30s.
#
# `location =` IS AN EXACT MATCH, which is both the tightest possible scope and
# the highest-priority form nginx has -- so it wins over the app's `location
# __PATH__/` below without depending on which is written first, and it cannot
# widen to a sub-path nobody meant to include. `__PATH__/` is substituted to a
# single `/` at a root install (YunoHost's templating helper special-cases it),
# so this reads /api/backup there and /conduit/api/backup at a sub-path one.
#
# THE INCLUDE IS NOT DECORATION. proxy_set_header is not inherited into a
# location that is configured on its own, and proxy_params_with_auth is what
# carries the Ynh-User header SSOwat sets -- without it this route would see no
# identity at all and answer 401 to everybody. The SSOwat access phase itself is
# declared at the server level and so applies here without being repeated.
location = __PATH__/api/backup {

  proxy_pass http://127.0.0.1:__PORT__/api/backup;
  include proxy_params_with_auth;

  client_max_body_size 50M;
  proxy_read_timeout 3600;
  proxy_connect_timeout 30;

  proxy_buffering off;
  proxy_cache off;
}

# THE RESTORE PREVIEW: THE ONLY ROUTE IN THIS APP THAT RECEIVES SOMETHING LARGE.
#
# 7.7 uploads a whole backup archive. Two of the app's ordinary settings refuse
# that outright and one of them is not about size at all.
#
# client_max_body_size. The app's own block below carries 50M, which is a bound
# written for a mail attachment. services/intake.ts accepts up to 8 GiB, and a
# backup is roughly the size of the install -- so at 50M every restore of a real
# install is refused BY NGINX, which answers its own HTML 413 that the
# application never sees. The operator gets an unstyled proxy error where the
# page had promised a message naming the limit.
# 9g AND NOT 8g, because the two bounds measure different things: the app's
# limit is on the FILE PART and this one is on the WHOLE BODY, which also
# carries the multipart preamble, the passphrase field and every boundary. Set
# equal, a file of exactly the app's ceiling is refused here a few hundred bytes
# over -- the very failure this directive exists to prevent.
# packages/api/src/services/restore-nginx.test.ts parses the value here back to
# bytes and fails unless it is STRICTLY above the app's own ceiling, so raising
# one and not the other is a red test rather than a broken restore.
#
# proxy_read_timeout, for the reason the backup block above carries one: after
# the last byte arrives the app decrypts the archive, unpacks it, reads the
# manifest and measures the live database before it answers. Nothing is written
# to the response until all of that is done, so the gap the proxy is measuring
# is the whole of it.
#
# proxy_request_buffering off, AND THIS ONE IS ABOUT A CREDENTIAL RATHER THAN
# ABOUT SIZE. nginx buffers a request body to disk by default. This body is
# multipart and the PASSPHRASE FIELD COMES FIRST IN IT -- routes/restore.ts
# requires that order, because Fastify's multipart parser is streaming -- so a
# buffered body puts the archive's passphrase into nginx's client_body_temp_path
# in the clear. 7.6's rule is that the passphrase is never stored, logged or
# written to disk, and this is what keeps that true of the deployment rather
# than only of the process. With it off the archive is written exactly once, by
# receiveIntake, at 0600 inside $data_dir.
#
# WHAT THE EXPOSURE ACTUALLY IS, MEASURED ON THE DEPLOY TARGET, because the
# first version of this comment overstated it and a reader who checked would
# have concluded the directive was optional. Buffered, with a real multipart
# body and the passphrase first: client_body_temp_path stays EMPTY, and the
# worker holds one open descriptor to a file that has already been unlinked --
# mode 0600, links 0 -- whose first bytes are the passphrase. nginx creates and
# unlinks in the same call, so there is never a named file lying around and the
# inode is released when the request ends. It is NOT "a file Conduit cannot
# delete". It is the passphrase in disk blocks for the duration of the upload:
# recoverable from a crash, a disk image, or anything that reads the raw device.
# That is still a passphrase written to disk, which the rule forbids outright,
# so the directive stays -- on the honest reason rather than a louder one.
# Unbuffered, the same upload opens ZERO body descriptors and delivers the same
# bytes upstream.
#
# HTTP/1.1 UPSTREAM: REQUIRED BY THIS BLOCK, AND DELIBERATELY NOT DECLARED IN IT.
# An unbuffered body that arrives chunked cannot be forwarded over the HTTP/1.0
# nginx speaks upstream by default, so proxy_http_version 1.1 is a requirement
# of this location rather than a nicety. `include proxy_params_with_auth` above
# already sets it -- it is line 12 of YunoHost's own template in
# /usr/share/yunohost/conf/nginx/ -- and RESTATING IT IS AN [emerg], NOT A
# HARMLESS REPETITION. An include is inlined where it appears, so a second
# proxy_http_version at the same level is "directive is duplicate" and nginx
# refuses to load the WHOLE configuration. That is not this route failing; that
# is every site on the box failing, at the next reload or reboot.
# This block carried that duplicate until the v1.4.0 release rendered the file
# the way ynh_config_add_nginx does and handed it to `nginx -t`, which rejected
# it. A string-matching guard had asserted the duplicate's PRESENCE and passed,
# because nothing had ever handed the file to a parser.
# packages/api/src/services/restore-nginx.test.ts now asserts its ABSENCE.
#
# WHAT IS DELIBERATELY NOT RAISED: client_body_timeout and proxy_send_timeout,
# both 60s by default, which bound the gap between two successive reads from the
# client rather than the whole upload. An active upload never approaches that,
# and raising them would widen the window
# packages/api/src/services/write-gate.ts names as a denial of recovery -- an
# authenticated client holding a slow POST open keeps the drain's in-flight
# count above zero, and every restore refuses to start while it does. Sixty
# seconds of that is a nuisance; an hour of it is somebody unable to recover
# their install.
#
# AND THE WINDOW IS ONE THIS BLOCK OPENS, said plainly rather than left for
# somebody to find. With request buffering ON -- every other route -- nginx
# absorbs the whole body first and only then opens the upstream request, so a
# slow uploader never appears in the app's in-flight set at all. Turning it OFF
# is what puts a trickling client into that set for as long as it trickles. That
# is accepted: a passphrase written into client_body_temp_path is the worse of
# the two, it is why buffering is off, and the 60s gap bounds are what keep the
# denial bounded. It is recorded here because the two directives above are NOT
# raised on the strength of this reasoning, and reasoning that omitted the cost
# would be the wrong reason for the right setting.
location = __PATH__/api/restore/inspect {

  proxy_pass http://127.0.0.1:__PORT__/api/restore/inspect;
  include proxy_params_with_auth;

  client_max_body_size 9g;
  proxy_read_timeout 3600;
  proxy_connect_timeout 30;

  proxy_request_buffering off;

  proxy_buffering off;
  proxy_cache off;
}

# THE RESTORE ITSELF. A tiny body and the longest wait in the application.
#
# The request carries three short fields -- a plan id, the passphrase and the
# typed install name -- so nothing here is about size, and client_max_body_size
# stays at the app's own 50M rather than being tuned to a number nobody could
# explain later. The route's zod schema is the real bound and it is far tighter.
#
# THE WAIT IS WHAT THIS BLOCK EXISTS FOR. Before it destroys anything, apply
# takes a whole safety backup -- which costs exactly what the backup route costs
# and is why that route has an hour -- and then loads a dump on top of it and
# runs migrations. It is the longest single request Conduit has, and at the 300
# seconds below it would 504 part way through a restore, with the operator
# holding a proxy error and no way to tell whether their database still exists.
location = __PATH__/api/restore/apply {

  proxy_pass http://127.0.0.1:__PORT__/api/restore/apply;
  include proxy_params_with_auth;

  client_max_body_size 50M;
  proxy_read_timeout 3600;
  proxy_connect_timeout 30;

  proxy_buffering off;
  proxy_cache off;
}

# THE TWO IMPORTERS, AND THE THREE ROUTES OF THEM THAT RECEIVE A FILE.
#
# THE SAME FAILURE THE RESTORE PREVIEW HAS, WITH A DIFFERENT ARTEFACT IN IT.
# The app's own block below carries `client_max_body_size 50M`, which is a bound
# written for a mail attachment. A Conduit export is roughly the size of the
# install it came from, and a foreign CSV of 200,000 contacts measured 14.1MB --
# so at 50M a real import is refused BY NGINX, which answers its own HTML 413
# that the application never sees. The operator gets an unstyled proxy error
# where the page had promised a message naming the limit, and neither importer
# is reachable at all for anything but a toy file.
# 9g AND NOT 8g, for the restore block's reason exactly: the app's cap is on the
# FILE PART and this one is on the WHOLE BODY, which also carries the multipart
# preamble, the mapping field and every boundary.
# packages/api/src/routes/import-nginx.test.ts parses these values back to bytes
# and fails unless they are STRICTLY above the app's own ceiling.
#
# THE WAIT, for the reason the backup and restore blocks carry one: nothing is
# written to the response until all of the work is done. A preview unpacks the
# archive and reads every row before it answers, and an apply of 200,000 rows
# measured 21.5s for the exact importer and 43.9s for the foreign one on the
# deploy target -- inside the 300s default, and a file ten times the size is
# not, while the app's own ceiling is 8 GiB.
#
# REQUEST BUFFERING IS LEFT ON, AND THAT IS THE DIFFERENCE FROM THE RESTORE
# PREVIEW RATHER THAN AN OVERSIGHT. That directive is off there because that
# body's FIRST FIELD IS THE ARCHIVE PASSPHRASE, and a buffered body puts a
# passphrase into disk blocks; 7.6's rule forbids that outright. NEITHER
# IMPORTER TAKES A PASSPHRASE -- an export is not encrypted and a CSV is not an
# archive -- so there is no secret in these bodies and nothing to buy. What
# buffering ON is worth is named in the restore block and applies here in the
# operator's favour: with it on, nginx absorbs the whole body before it opens
# the upstream request, so a slow uploader never enters the app's in-flight
# write set and can never hold a restore's drain above zero. Turning it off
# would widen packages/api/src/services/write-gate.ts's denial-of-recovery
# window for no gain at all.
#
# `location =` IS AN EXACT MATCH PER ROUTE, and the two apply routes are listed
# separately with the app's ordinary 50M BECAUSE THEY MUST NOT INHERIT THE
# CAPACITY ABOVE. A prefix `location __PATH__/api/import/` would have been three
# blocks shorter and would have let any authenticated caller POST nine gigabytes
# at /api/import/csv/apply -- a route whose real body is one uuid -- which
# nginx would buffer to its own temp directory before the app rejected it at
# Fastify's 1MB JSON limit. That is a disk-fill vector bought for tidiness.
location = __PATH__/api/import/export/inspect {

  proxy_pass http://127.0.0.1:__PORT__/api/import/export/inspect;
  include proxy_params_with_auth;

  client_max_body_size 9g;
  proxy_read_timeout 3600;
  proxy_connect_timeout 30;

  proxy_buffering off;
  proxy_cache off;
}

location = __PATH__/api/import/csv/inspect {

  proxy_pass http://127.0.0.1:__PORT__/api/import/csv/inspect;
  include proxy_params_with_auth;

  client_max_body_size 9g;
  proxy_read_timeout 3600;
  proxy_connect_timeout 30;

  proxy_buffering off;
  proxy_cache off;
}

# The mapping step's second upload: the same file again, with what the operator
# decided about its columns. See packages/api/src/routes/import.ts's decision 2
# for why the file is sent twice rather than held on the server between the two.
location = __PATH__/api/import/csv/plan {

  proxy_pass http://127.0.0.1:__PORT__/api/import/csv/plan;
  include proxy_params_with_auth;

  client_max_body_size 9g;
  proxy_read_timeout 3600;
  proxy_connect_timeout 30;

  proxy_buffering off;
  proxy_cache off;
}

# THE TWO APPLIES. A body of one uuid and the longest wait either importer has:
# 200,000 rows in one transaction. client_max_body_size stays at the app's own
# 50M deliberately -- see the note above about what a prefix location would have
# cost here.
location = __PATH__/api/import/export/apply {

  proxy_pass http://127.0.0.1:__PORT__/api/import/export/apply;
  include proxy_params_with_auth;

  client_max_body_size 50M;
  proxy_read_timeout 3600;
  proxy_connect_timeout 30;

  proxy_buffering off;
  proxy_cache off;
}

location = __PATH__/api/import/csv/apply {

  proxy_pass http://127.0.0.1:__PORT__/api/import/csv/apply;
  include proxy_params_with_auth;

  client_max_body_size 50M;
  proxy_read_timeout 3600;
  proxy_connect_timeout 30;

  proxy_buffering off;
  proxy_cache off;
}

location __PATH__/ {

  proxy_pass http://127.0.0.1:__PORT__/;
  include proxy_params_with_auth;

  client_max_body_size 50M;
  proxy_read_timeout 300;
  proxy_connect_timeout 30;

  # Server-sent events arrive in Phase 2 and need buffering off to stream.
  proxy_buffering off;
  proxy_cache off;
}
